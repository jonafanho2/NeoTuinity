name: Build Tuinity

on: [ push, pull_request ]

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17 ] # Updated from EOL Java 16; change to 21 if targeting newer Minecraft versions
      fail-fast: true

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Patch Tuinity
        run: ./gradlew applyPatches --stacktrace --no-daemon

      - name: Build Tuinity
        run: |
          ./gradlew build --stacktrace --no-daemon
          ./gradlew paperclipJar --stacktrace --no-daemon

      - name: Archive Tuinity Paperclip
        uses: actions/upload-artifact@v7
        with:
          name: Tuinity
          path: tuinity-paperclip.jar

          
